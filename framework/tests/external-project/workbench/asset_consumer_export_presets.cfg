; Test-only preset for the designated external validation project.
; Temporarily install only when that project has no export_presets.cfg; restore its absence afterward.
[preset.0]
name="Asset consumer boundary check"
platform="Windows Desktop"
runnable=false
export_filter="scenes"
export_files=PackedStringArray("res://yaya/asset_workbench/examples/single/example_game.tscn", "res://yaya/asset_workbench/examples/composition/example_composition.tscn", "res://yaya/asset_workbench/examples/shader_composition/example_composition.tscn", "res://yaya/asset_workbench/examples/effects_composition/example_consumer.tscn")
include_filter="components/feedback/*.gd,addons/sound_manager/abstract_audio_player_pool.gd,addons/sound_manager/LICENSE,yaya/asset_workbench/examples/*license*"
exclude_filter="yaya/asset_workbench/ui/*,yaya/asset_workbench/analyzer/*,yaya/tools/*,tests/*,addons/gdUnit4/*,addons/gdscript-linter/*,reports/*,docs/*,yaya/methodology/*,yaya/agent-rules/*,.agents/*,.codex/*"
script_export_mode=0

[preset.0.options]
binary_format/embed_pck=false
