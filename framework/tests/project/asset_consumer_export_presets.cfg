; Test-only preset for the designated external validation project.
; Temporarily install only when that project has no export_presets.cfg; restore its absence afterward.
[preset.0]
name="Asset consumer boundary check"
platform="Windows Desktop"
runnable=false
export_filter="scenes"
export_files=PackedStringArray("res://examples/asset_workbench/single/example_game.tscn", "res://examples/asset_workbench/composition/example_composition.tscn", "res://examples/asset_workbench/shader_composition/example_composition.tscn", "res://examples/asset_workbench/effects_composition/example_consumer.tscn")
include_filter="components/feedback/*.gd,addons/sound_manager/abstract_audio_player_pool.gd,addons/sound_manager/LICENSE,examples/asset_workbench/*license*"
exclude_filter="tools/*,tests/*,addons/gdUnit4/*,addons/gdscript-linter/*,reports/*,docs/*,methodology/*,agent-rules/*,.agents/*,.codex/*"
script_export_mode=0

[preset.0.options]
binary_format/embed_pck=false
